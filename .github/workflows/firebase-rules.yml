name: Firebase Rules
on: [pull_request]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: firebase/tests
      - run: npm run test:emulator
        working-directory: firebase/tests
