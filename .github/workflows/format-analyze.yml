name: Format Analyze
on: [pull_request]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - if: ${{ hashFiles('apps/mobile/pubspec.yaml') != '' }}
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
