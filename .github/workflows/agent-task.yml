name: Agent Task State Check
on: [pull_request]
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r automation/orchestrator/requirements.txt
      - run: python automation/orchestrator/orchestrator.py status
