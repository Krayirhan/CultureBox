name: Release to Google Play
on:
  workflow_dispatch:
    inputs:
      track:
        required: true
        default: internal
        type: choice
        options: [internal, production]
      status:
        required: true
        default: completed
        type: choice
        options: [completed, inProgress]
      user_fraction:
        required: false
        default: ""
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Validate secrets
        shell: bash
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PKG: ${{ vars.ANDROID_PACKAGE_NAME }}
        run: |
          test -n "$PLAY_JSON"; test -n "$KS"; test -n "$SP"; test -n "$KA"; test -n "$KP"; test -n "$PKG"
      - name: Restore keystore
        shell: bash
        env: {KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'}
        run: echo "$KS" | base64 --decode > apps/mobile/android/upload-keystore.jks
      - name: Write key.properties
        shell: bash
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n" "$SP" "$KP" "$KA" > apps/mobile/android/key.properties
      - name: Quality gates and build
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
          flutter build appbundle --release
      - name: Upload Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.user_fraction }}
      - name: Cleanup
        if: always()
        run: rm -f apps/mobile/android/upload-keystore.jks apps/mobile/android/key.properties
